name: Generate and Commit Outputs

on:
  push:
    branches:
      - main
    paths:
      - '01_VerdeMetria/scripts/**'
      - '01_VerdeMetria/data/**'
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force regeneration of all outputs'
        required: false
        default: 'false'
        type: boolean
      create_pr:
        description: 'Create PR instead of direct commit'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-outputs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib folium shapely requests
          # Install geopandas only if heavy GeoJSON generation is needed
          # pip install geopandas
      
      - name: Download data from OneDrive (if configured)
        env:
          ONEDRIVE_TENANT_ID: ${{ secrets.ONEDRIVE_TENANT_ID }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          ONEDRIVE_SHARE_URL: ${{ secrets.ONEDRIVE_SHARE_URL }}
          ONEDRIVE_PUBLIC_LINK: ${{ secrets.ONEDRIVE_PUBLIC_LINK }}
        run: |
          echo "Checking OneDrive configuration..."
          if [ -n "$ONEDRIVE_PUBLIC_LINK" ] || [ -n "$ONEDRIVE_SHARE_URL" ]; then
            echo "OneDrive configured - attempting data download"
            python 01_VerdeMetria/scripts/download_from_onedrive.py \
              --url "${ONEDRIVE_PUBLIC_LINK:-$ONEDRIVE_SHARE_URL}" \
              --dest "01_VerdeMetria/outputs/source_data.csv" \
              ${ONEDRIVE_TENANT_ID:+--tenant-id "$ONEDRIVE_TENANT_ID"} \
              ${ONEDRIVE_CLIENT_ID:+--client-id "$ONEDRIVE_CLIENT_ID"} \
              ${ONEDRIVE_CLIENT_SECRET:+--client-secret "$ONEDRIVE_CLIENT_SECRET"} \
              || echo "Download failed or no data available - continuing with existing data"
          else
            echo "OneDrive not configured - skipping download"
          fi
      
      - name: Generate derived outputs
        run: |
          echo "Generating derived outputs..."
          python 01_VerdeMetria/scripts/generate_derived.py --test
          
          echo "Generated files:"
          ls -la 01_VerdeMetria/outputs/ || true
      
      - name: Check for changes
        id: check_changes
        run: |
          git add 01_VerdeMetria/outputs/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in outputs"
            git diff --staged --name-only
          fi
      
      - name: Commit and create PR
        if: steps.check_changes.outputs.has_changes == 'true' && (github.event.inputs.create_pr == 'true' || github.event.inputs.create_pr == '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Create branch
          BRANCH_NAME="outputs/update-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          
          # Commit changes
          git commit -m "chore(outputs): regenerate derived outputs [automated]"
          
          # Push branch
          git push origin "$BRANCH_NAME"
          
          # Create PR
          gh pr create \
            --title "Update derived outputs (automated)" \
            --body "## Automated Output Generation
          
          This PR was automatically generated by the GitHub Actions workflow.
          
          ### Changes
          - Regenerated CSV files (filtered, top10)
          - Updated GeoJSON files (simplified)
          - Generated/updated visualization files (HTML, PNG)
          
          ### Verification
          - [ ] Check generated CSV files are valid
          - [ ] Verify GeoJSON renders correctly
          - [ ] Test Streamlit app with new outputs
          
          ---
          *Generated on: $(date -u +"%Y-%m-%d %H:%M:%S UTC")*
          " \
            --base main \
            --head "$BRANCH_NAME"
      
      - name: Direct commit (if PR disabled)
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.inputs.create_pr == 'false'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git commit -m "chore(outputs): regenerate derived outputs [automated]"
          git push origin main
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-outputs
          path: |
            01_VerdeMetria/outputs/*.csv
            01_VerdeMetria/outputs/*.geojson
            01_VerdeMetria/outputs/*.html
            01_VerdeMetria/outputs/*.png
          retention-days: 7
          if-no-files-found: warn
